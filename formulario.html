<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/index.css">
    <title>Mil formas de hacer papas | Contacto</title>
</head>
<body>
    <header>
         <nav>
            <div class="marca">
                <img src="imagenes/papalibro.webp" alt="Papita leyendo un libro de recetas">
                <h1>Mil formas de hacer papas</h1>
            </div>

          <ul class="menuNavegacion">
            <li> <a href="index.html">Inicio</a></li>
            <li><a href="receta.html">Recetas</a></li>
            <li><a class="activo" href="formulario.html">Contacto</a></li>
          </ul>
        </nav>

    </header>
    <main>
        <section class="presentacion-contacto">
            <div>
                <h2>Contacto</h2>
                <p id="txtForm">¿Tenés una consulta o querés compartir una receta? Completá el formulario y contanos tu idea.</p>
            </div>
            <img src="imagenes/papa-sobre.webp" alt="Papita sonriente sosteniendo un sobre">
        </section>
        <form id="formulario-contacto" novalidate>
            <div id="secciones">
                 <label for="nombre">Nombre</label>
                 <input type="text" name="nombre" id="nombre" minlength="4" maxlength="40" placeholder="Tu nombre" required aria-describedby="error-nombre">
                 <p id="error-nombre" class="error"></p>

                 <label for="correo">Correo electronico</label>
                 <input type="email" name="correo" id="correo" placeholder="ejemplo@correo.com" required aria-describedby="error-correo">
                 <p id="error-correo" class="error"></p>

                 <label for="telefono">Telefono</label>
                 <input type="tel" name="telefono" id="telefono" placeholder="10 dígitos, sin espacios ni guiones" required aria-describedby="error-telefono">
                 <p id="error-telefono" class="error"></p>

                 <label for="mensaje">Mensaje</label>
                 <textarea name="mensaje" id="mensaje" placeholder="Escribí tu mensaje" cols="25" rows="5" required minlength="10" maxlength="500" aria-describedby="error-mensaje"></textarea>
                 <p id="error-mensaje" class="error"></p>

                 <input type="submit" value="Enviar">

            </div>

           



        </form>
        <div id="resumen"></div>
   
    </main>

    <footer>
        <p>Mil formas de hacer papas · 2026</p>
    </footer>
    <script src="formulario.js"></script>
</body>
</html>
